name: Build report and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily refresh at 10:00 ET: injury reports (Wed-Fri), expert rankings (Fri) and scores change without a push.
    # The page rolls over to the next week at 06:00 ET Tuesday. GitHub's schedules are best-effort (often late,
    # sometimes skipped: the 10:00 run never fired on 2026-10-13), so Tuesday gets its own early run as well:
    # 11:30 UTC = 07:30 EDT / 06:30 EST, after the rollover in both.
    - cron: "0 14 * * *"
    - cron: "30 11 * * 2"
    # Practice reports come out in the afternoon (teams post ~4-5 PM ET, NFL.com and ESPN follow), so the 10:00
    # run alone showed the previous day's practice until the next morning (owner 2026-10-15). Wed-Fri evening run:
    # 22:15 UTC = 6:15 PM EDT / 5:15 PM EST. Saturday afternoon for late downgrades and elevations; Sunday after the
    # 1 PM games' inactives (posted 90 minutes before kickoff): 16:45 UTC = 12:45 PM EDT / 11:45 AM EST.
    - cron: "15 22 * * 3,4,5"
    - cron: "0 21 * * 6"
    - cron: "45 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write   # commits newly finished weeks to the archive branch
  pages: write
  id-token: write
  actions: read     # the UI-only path downloads the last deployed site (another run's artifact)

concurrency:
  group: pages
  cancel-in-progress: false   # never interrupt a run mid-way through committing archive pages

jobs:
  # UI-only pushes (every changed file under nfledge/static/) skip the data pipeline: the 'fast' job takes the last
  # deployed site, drops the new assets in (tools/assets_deploy.py) and deploys in ~2 minutes. Anything else, the
  # schedule and manual runs do the full build; so does a failed fast path (e.g. the last site's artifact expired).
  plan:
    runs-on: ubuntu-latest
    outputs:
      fast: ${{ steps.diff.outputs.fast }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          fast=false
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            echo "$files"
            if [ -n "$files" ] && ! echo "$files" | grep -qv '^nfledge/static/'; then fast=true; fi
          fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "UI-only fast path: $fast"

  fast:
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the last deployed site
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the newest site bundle any run uploaded (a run's overall status can read failed although it deployed:
          # a failed fast path followed by a good full build)
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=github-pages&per_page=100" -q '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          test -n "$id"
          echo "last site: run $id"
          echo "run=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: last
          run-id: ${{ steps.last.outputs.run }}
          github-token: ${{ github.token }}
      - name: New assets over the last site
        run: |
          mkdir site && tar -xf last/artifact.tar -C site
          python3 tools/assets_deploy.py --site=site
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 7
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    needs: [plan, fast]
    if: always() && (needs.plan.outputs.fast != 'true' || needs.fast.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Past weeks: one page per season/week, built once and kept on the 'archive' branch (main stays small).
      - uses: actions/checkout@v4
        with:
          ref: archive
          path: site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Data cache carries over between runs so only new weeks / live data are refetched.
      - uses: actions/cache@v4
        with:
          path: cache
          key: nfl-cache-${{ github.run_id }}
          restore-keys: nfl-cache-
      - name: Check the Model tab is current
        run: python tools/model_doc.py --check || echo "::warning::MODEL.md is out of date - the Model tab may not describe the latest model changes"
      # A week that just finished (after Tuesday's rollover) gets its archived page; existing pages are untouched
      # unless their week has gained data since they were built (a Monday game nflverse published late).
      - name: Archive newly finished weeks
        run: python tools/build_archive.py --out=site --missing-only
      # ESPN's injury feed (diagnosis, estimated return date) has no history, so it is archived daily until there is
      # enough to TEST it as a return-model input (tools/espn_snapshot.py). Failures never fail the build.
      - name: Snapshot ESPN injury feed
        run: python tools/espn_snapshot.py --out=site/data/espn_injuries || true
      # ESPN news blurbs for listed players (once a day; no history on ESPN, so archived going forward) and the
      # in-game injuries parsed from them ("left Sunday's game", "did not return"): depth charts + Injuries tab.
      - name: Archive ESPN injury news
        run: python tools/espn_news.py --out=site/data/espn_news || true
      # Sleeper's projections keep only the last saved value, edited after games (in-game injuries zeroed), so a blend
      # can't be backtested from their API: save what they show before kickoff, every run (tools/sleeper_snapshot.py).
      - name: Snapshot Sleeper projections
        run: python tools/sleeper_snapshot.py --out=site/data/sleeper_proj || true
      # FantasyPros weekly ECR is re-scraped twice a day but only Friday's is kept in nflverse's history: save each scrape
      # for the early-week ECR forward test (tools/ecr_snapshot.py; INSIGHTS sec. 9).
      - name: Snapshot expert rankings
        run: python tools/ecr_snapshot.py --out=site/data/ecr_snapshots || true
      - name: Commit new archive pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Archive weeks ($(date -u +%Y-%m-%d))"
            # Someone may push to archive mid-run (e.g. a manual archive rebuild): rebase onto it and retry. On a
            # clash this run's files win (-X theirs = the commit being replayed): its snapshot is the newer one.
            for i in 1 2 3; do
              git push origin HEAD:archive && break
              git pull --rebase -X theirs origin archive
            done
          fi
      # Current week (index.html) and the rest of the season (lookahead pages, rebuilt every run, never committed).
      - run: python run.py --out site/index.html --lookahead
      # Players > Rankings > Rest of season: this week + the lookahead weeks summed per player through week 17.
      - name: Rest of season
        run: python tools/ros_build.py --site=site
      # League tab: kicker (and team-defense) projections, this week through 17 (reads the week pages above).
      - name: Kickers and defenses
        run: python tools/kdst_build.py --site=site
      # Career game logs for the player card (one JSON per player; reads the week data files built above).
      - name: Player game logs
        run: python tools/player_logs.py --site=site
      # Teams > Standings data (every season since 2002; ~10 s), rendered in the browser by assets/standings.js.
      - name: Standings
        run: python tools/standings_build.py --site=site
      # Teams > Stats + Players > Stats data (1999 on). Finished seasons are aggregated once and kept in the cache;
      # the current season is redone when a game goes final.
      # League tab: Sleeper / ESPN / Yahoo player ids -> ours (+ names), for imported fantasy rosters.
      - name: Fantasy id map
        run: python tools/fantasy_ids_build.py --site=site
      - name: Season stats
        run: python tools/stats_build.py --site=site
      # Teams > Draft data (every pick since 1980 with career outcomes; ~2 s).
      - name: Draft
        run: python tools/draft_build.py --site=site
      # Teams > Playoffs history (every postseason since 1920; 1933-98 from data/history/, seeds 1975-98 cached there).
      - name: Playoffs
        run: python tools/playoffs_build.py --site=site
      # Teams > Playoffs odds: 10,000 simulated seasons as of the week the site shows (~1 min); track record from
      # data/history/playoff_odds_backtest.json.
      - name: Playoff odds
        run: python tools/playoff_odds.py --site=site
      # The odds-by-week chart needs each week's odds kept: commit only that file to the archive branch (the archive commit
      # above runs before the odds exist). Failures never fail the build.
      # Also what this build fed the model (data/live_inputs/, written by run.py: lines, wind, ECR scrape, projections),
      # so backtest accuracy can be checked against what the live site actually used.
      - name: Keep playoff odds and live input history
        working-directory: site
        run: |
          git add data/live_inputs/*.json || true
          git add data/playoffs/hist_*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Playoff odds and live inputs ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              git push origin HEAD:archive && break
              git pull --rebase -X theirs origin archive
            done
          fi
      # Players > Moves: ESPN's transactions log, 2002 on (past seasons fetched once into the cache, this season daily).
      - name: Moves
        run: python tools/transactions_build.py --site=site
      # Team page > Depth: every team's latest depth chart (ESPN's, via nflverse; after Player game logs, which it links to).
      - name: Depth charts
        run: python tools/depth_build.py --site=site
      # Players > Trends: compact play-by-play per season since 1999 (finished seasons cached), queried in the browser.
      - name: Trends
        run: python tools/trends_build.py --site=site
      # Player pages: NFL Edge grade (production percentile, 2018 on; tools/grade_build.py).
      - name: Edge grades
        run: python tools/grade_build.py --site=site
      # Team / player pages and Teams > Stats: penalties per season since 1999 (tools/penalties_build.py).
      - name: Penalties
        run: python tools/penalties_build.py --site=site
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 7   # the UI-only path builds on the last deployed site, so keep it past a skipped schedule
      - id: deployment
        uses: actions/deploy-pages@v4

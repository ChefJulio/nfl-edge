name: Build report and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily refresh at 10:00 ET: injury reports (Wed-Fri), expert rankings (Fri) and scores change without a push.
    # The page rolls over to the next week at 06:00 ET Tuesday. GitHub's schedules are best-effort (often late,
    # sometimes skipped: the 10:00 run never fired on 2026-10-13), so Tuesday gets its own early run as well:
    # 11:30 UTC = 07:30 EDT / 06:30 EST, after the rollover in both.
    # Since 2026-10-18 the week clock drives builds through news-watch.yml (report deadlines, inactives, rollover for
    # every game day); these fixed times stay as a safety net. GitHub schedules run in UTC: after DST ends (Nov 1) each
    # lands an hour earlier in Eastern time.
    - cron: "0 14 * * *"
    - cron: "30 11 * * 2"
    # Practice reports come out in the afternoon (teams post ~4-5 PM ET, NFL.com and ESPN follow), so the 10:00
    # run alone showed the previous day's practice until the next morning (owner 2026-10-15). Wed-Fri evening run:
    # 22:15 UTC = 6:15 PM EDT / 5:15 PM EST. Saturday afternoon for late downgrades and elevations; Sunday after the
    # 1 PM games' inactives (posted 90 minutes before kickoff): 16:45 UTC = 12:45 PM EDT / 11:45 AM EST.
    - cron: "15 22 * * 3,4,5"
    - cron: "0 21 * * 6"
    - cron: "45 16 * * 0"
    # Nightly complete build at 2 a.m. Central (owner 2026-10-24): GitHub schedules are UTC and ignore daylight saving,
    # so both 07:00 (CDT) and 08:00 (CST) are listed and the plan step runs only the one that is 2 a.m. in Chicago.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        # news (owner 2026-10-23: "i hate how we feel 3 hours+ behind sometimes"): the watcher's lane for injury news,
        # reports, inactives and line moves: this week's page only, over the last deployed site, in ~6-8 minutes
        description: "full (the slow data carried from the last site), complete (everything), news (this week's page)"
        default: full
        type: choice
        options: [full, complete, news]

permissions:
  contents: write   # commits newly finished weeks to the archive branch
  pages: write
  id-token: write
  actions: read     # the UI-only path downloads the last deployed site (another run's artifact)

concurrency:
  group: pages
  cancel-in-progress: false   # never interrupt a run mid-way through committing archive pages

jobs:
  # UI-only pushes (every changed file under nfledge/static/) skip the data pipeline: the 'fast' job takes the last
  # deployed site, drops the new assets in (tools/assets_deploy.py) and deploys in ~2 minutes. Anything else, the
  # schedule and manual runs do the full build; so does a failed fast path (e.g. the last site's artifact expired).
  plan:
    runs-on: ubuntu-latest
    outputs:
      fast: ${{ steps.diff.outputs.fast }}
      news: ${{ steps.diff.outputs.news }}
      skip: ${{ steps.diff.outputs.skip }}
      complete: ${{ steps.diff.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Lanes by what a push touched (owner 2026-10-24: "we rapid fire new iterations sometimes and they conflict"):
          # docs/ only (the lab notebook: no build reads it) -> no build; UI files only -> fast; MODEL.md (the Model tab,
          # rendered with the week's page) with only docs / UI besides -> news; anything else -> full.
          fast=false; news=false; skip=false
          # (owner 2026-10-25: "are we losing any changes because they overwrite eachother?") a newer run replaces a
          # waiting one in the pages queue, so lanes go by what the LIVE site was built from, not the previous push:
          # data/full_build.json (the commit of the last full build) and data/deployed.json (the last deploy of any lane).
          # Anything but docs / UI / MODEL.md changed since the last full build -> full, whatever this push touched (a
          # UI-only push that replaced a waiting full build used to take the fast lane and skip the data it needed).
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          full_sha=$(curl -sf "$site/data/full_build.json?x=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          dep_sha=$(curl -sf "$site/data/deployed.json?x=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          echo "live site: last full build ${full_sha:-unknown}, last deploy ${dep_sha:-unknown}"
          if [ -n "$full_sha" ] && git cat-file -e "$full_sha^{commit}" 2>/dev/null; then
            data=$(git diff --name-only "$full_sha" "${{ github.sha }}" | grep -vE '^(docs/|nfledge/static/|MODEL\.md$)' || true)
            ref="$dep_sha"; git cat-file -e "$ref^{commit}" 2>/dev/null || ref="$full_sha"
            files=$(git diff --name-only "$ref" "${{ github.sha }}")
            echo "since the last full build (data): ${data:-none}"; echo "since the last deploy:"; echo "$files"
            if [ "${{ github.event_name }}" = push ] || { [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.mode }}" = news ]; }; then
              if [ -n "$data" ]; then :  # full (a dispatched news build too: the data it would skip comes first)
              elif [ "${{ github.event_name }}" = workflow_dispatch ]; then news=true
              elif [ -z "$files" ] || ! echo "$files" | grep -qv '^docs/'; then skip=true
              elif ! echo "$files" | grep -qv '^nfledge/static/'; then fast=true
              else news=true  # MODEL.md (with docs / UI): the news lane renders it and copies the assets
              fi
            fi
          elif [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # no stamp on the live site yet (the first build after this change): the old rule, this push only
            files=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            echo "$files"
            if [ -n "$files" ] && ! echo "$files" | grep -qv '^docs/'; then skip=true
            elif [ -n "$files" ] && ! echo "$files" | grep -qv '^nfledge/static/'; then fast=true
            elif [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/|nfledge/static/|MODEL\.md$)'; then news=true
            fi
          elif [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.mode }}" = news ]; then news=true
          fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "UI-only fast path: $fast; docs only, no build: $skip"
          # the nightly complete build (2 a.m. Central) rebuilds everything, the slow data too; the other UTC hour of the
          # pair is skipped. A dispatched "complete" (the watcher's rollover / Sunday play-by-play) does the same.
          complete=false
          sch="${{ github.event.schedule }}"
          # Which of the pair is 2 a.m. goes by Chicago's offset (CDT -0500 -> 07:00 UTC, CST -0600 -> 08:00), not the
          # hour the run starts: GitHub fires these 5-6 hours late (2026-10-27/28 at 12:47-14:44 UTC), so "is it 02 in
          # Chicago now" skipped both every night and the complete build never ran (owner 2026-10-29: practice
          # timelines a week stale on the player card).
          if [ "$sch" = "0 7 * * *" ] || [ "$sch" = "0 8 * * *" ]; then
            want="0 8 * * *"; [ "$(TZ=America/Chicago date +%z)" = "-0500" ] && want="0 7 * * *"
            if [ "$sch" = "$want" ]; then complete=true; else skip=true; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.mode }}" = complete ]; then complete=true; fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "complete build (slow data rebuilt): $complete"
          echo "news=$news" >> "$GITHUB_OUTPUT"
          echo "news lane: $news"

  fast:
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the last deployed site
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the newest site bundle any run uploaded (a run's overall status can read failed although it deployed:
          # a failed fast path followed by a good full build)
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=github-pages&per_page=100" -q '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          test -n "$id"
          echo "last site: run $id"
          echo "run=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: last
          run-id: ${{ steps.last.outputs.run }}
          github-token: ${{ github.token }}
      - name: New assets over the last site
        run: |
          mkdir site && tar -xf last/artifact.tar -C site
          python3 tools/assets_deploy.py --site=site
          # Model > Calc > Graded calls follow the engine: regrade with the new calc_engine.js (inputs from the last build)
          node tools/calc_grade.mjs --site=site || echo "[grade] skipped"
      - name: Stamp the deploy  # the plan reads it (lanes by what the live site was built from)
        run: echo "{\"sha\":\"${{ github.sha }}\",\"lane\":\"fast\"}" > site/data/deployed.json
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 7
      - id: deployment
        uses: actions/deploy-pages@v4

  # News lane (owner 2026-10-23): the full build takes 15-20 minutes plus any queue, mostly steps injury news doesn't
  # touch (trends, stats, logs, depth charts). The watcher (tools/news_watch.py) starts this instead for news: the last
  # deployed site, this week's page rebuilt (run.py: fresh reports, ESPN, lines; the model reused unless a week
  # completed), Rest of season, the ESPN snapshot the watcher compares against, and what the audits need committed
  # to the archive branch (live inputs, ESPN snapshots). Falls back to the full build if it fails.
  news:
    needs: plan
    if: needs.plan.outputs.news == 'true' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the last deployed site
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=github-pages&per_page=100" -q '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          test -n "$id"
          echo "last site: run $id"
          echo "run=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: last
          run-id: ${{ steps.last.outputs.run }}
          github-token: ${{ github.token }}
      - run: mkdir site && tar -xf last/artifact.tar -C site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: nfl-cache-${{ github.run_id }}
          restore-keys: nfl-cache-
      - name: Snapshot ESPN injury feed
        run: python tools/espn_snapshot.py --out=site/data/espn_injuries || true
      - run: python run.py --out site/index.html
      - name: Rest of season
        run: python tools/ros_build.py --site=site || echo "[ros] skipped"
      # (owner 2026-10-25: "standings page not updating after the game results?") the watcher builds this lane when a
      # game goes final; ESPN's finals fill in where nflverse hasn't posted them yet (~10 s)
      - name: Standings
        run: python tools/standings_build.py --site=site --seasons=$(python -c "import nflreadpy as n; print(n.get_current_season())") || echo "[standings] skipped"
      - name: Current assets
        run: python tools/assets_deploy.py --site=site
      - name: Stamp the deploy  # the plan reads it (lanes by what the live site was built from)
        run: echo "{\"sha\":\"${{ github.sha }}\",\"lane\":\"news\"}" > site/data/deployed.json
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 7
      - id: deployment
        uses: actions/deploy-pages@v4
      # what the audits read (game-day / ESPN-Active overrides, live inputs, ESPN snapshots): the full build rebuilds
      # the site from the archive branch, so anything only in this run's site would be lost
      - name: Keep live inputs and ESPN snapshots
        run: |
          git clone --depth 1 --branch archive --filter=blob:none --sparse "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" arch
          cd arch
          git sparse-checkout set data/live_inputs data/espn_injuries
          mkdir -p data/live_inputs data/espn_injuries
          cp -r ../site/data/live_inputs/. data/live_inputs/ 2>/dev/null || true
          cp -r ../site/data/espn_injuries/. data/espn_injuries/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_inputs data/espn_injuries
          if ! git diff --cached --quiet; then
            git commit -m "News build: live inputs and ESPN snapshots ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3; do
              git push origin HEAD:archive && break
              git pull --rebase -X theirs origin archive
            done
          fi

  deploy:
    needs: [plan, fast, news]
    if: always() && needs.plan.outputs.skip != 'true' && ((needs.plan.outputs.fast != 'true' && needs.plan.outputs.news != 'true') || needs.fast.result == 'failure' || needs.news.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Past weeks: one page per season/week, built once and kept on the 'archive' branch (main stays small).
      - uses: actions/checkout@v4
        with:
          ref: archive
          path: site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Data cache carries over between runs so only new weeks / live data are refetched.
      - uses: actions/cache@v4
        with:
          path: cache
          key: nfl-cache-${{ github.run_id }}
          restore-keys: nfl-cache-
      - name: Check the Model tab is current
        run: python tools/model_doc.py --check || echo "::warning::MODEL.md is out of date - the Model tab may not describe the latest model changes"
      # A week that just finished (after Tuesday's rollover) gets its archived page; existing pages are untouched
      # unless their week has gained data since they were built (a Monday game nflverse published late).
      - name: Archive newly finished weeks
        run: python tools/build_archive.py --out=site --missing-only
      # ESPN's injury feed (diagnosis, estimated return date) has no history, so it is archived daily until there is
      # enough to TEST it as a return-model input (tools/espn_snapshot.py). Failures never fail the build.
      - name: Snapshot ESPN injury feed
        run: python tools/espn_snapshot.py --out=site/data/espn_injuries || true
      # ESPN news blurbs for listed players (once a day; no history on ESPN, so archived going forward) and the
      # in-game injuries parsed from them ("left Sunday's game", "did not return"): depth charts + Injuries tab.
      - name: Archive ESPN injury news
        run: python tools/espn_news.py --out=site/data/espn_news || true
      # Sleeper's projections keep only the last saved value, edited after games (in-game injuries zeroed), so a blend
      # can't be backtested from their API: save what they show before kickoff, every run (tools/sleeper_snapshot.py).
      - name: Snapshot Sleeper projections
        run: python tools/sleeper_snapshot.py --out=site/data/sleeper_proj || true
      # FantasyPros weekly ECR is re-scraped twice a day but only Friday's is kept in nflverse's history: save each scrape
      # for the early-week ECR forward test (tools/ecr_snapshot.py; INSIGHTS sec. 9).
      - name: Snapshot expert rankings
        run: python tools/ecr_snapshot.py --out=site/data/ecr_snapshots || true
      # The weekly forecast record (tools/forecast_record.py): once a week's games are final and nflverse has its stats and
      # snap counts, what the site published before each game (from data/live_inputs), what happened, and the week's
      # scorecard -> data/records/ (append-only; committed below). Failures never fail the build.
      - name: Forecast record
        run: python tools/forecast_record.py --out=site/data/records --inputs=site/data/live_inputs || true
      - name: Commit new archive pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Archive weeks ($(date -u +%Y-%m-%d))"
            # Someone may push to archive mid-run (e.g. a manual archive rebuild): rebase onto it and retry. On a
            # clash this run's files win (-X theirs = the commit being replayed): its snapshot is the newer one.
            for i in 1 2 3; do
              git push origin HEAD:archive && break
              git pull --rebase -X theirs origin archive
            done
          fi
      # The slow, rarely-changing data (game logs, stats, trends, depth charts, history tables) is rebuilt by the nightly
      # complete build at 2 a.m. Central; other full builds carry it from the last deployed site (owner 2026-10-24: a full
      # build every push made news wait in the queue). Files this build makes overwrite carried ones; with no last site,
      # every step runs.
      - name: Carry the slow data from the last site
        id: carry
        if: needs.plan.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=github-pages&per_page=100" -q '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty' || true)
          if [ -n "$id" ] && gh run download "$id" -n github-pages -D last; then
            mkdir -p lastsite && tar -xf last/artifact.tar -C lastsite && cp -rn lastsite/. site/
            rm -rf last lastsite
            echo "carried=true" >> "$GITHUB_OUTPUT"
            echo "carried the slow data from run $id"
          else
            echo "no last site: building everything"
          fi
      # Current week (index.html) and the rest of the season (lookahead pages, rebuilt every run, never committed).
      # the training history's fingerprint, column by column (2026-10-24: live and local trained different injury models)
      - name: Training cache fingerprint
        run: python tools/cache_fingerprint.py || true
      - run: python run.py --out site/index.html --lookahead
      # (owner 2026-10-24) the availability model vs history, exact practice pattern by pattern: a pattern off by more
      # than chance allows stops the build before anything deploys (tools/avail_check.py)
      - name: Availability check
        run: python tools/avail_check.py
      # Players > Rankings > Rest of season: this week + the lookahead weeks summed per player through week 17.
      - name: Rest of season
        run: python tools/ros_build.py --site=site
      # Games > Calc and the gamecast's Decisions: the in-game win probability model + decision inputs
      # (data/calc/model.json; retrained when its code changes or a week completes, cached in cache/calc_<key>.json).
      - name: Calculator
        run: |
          python tools/calc_build.py --site=site || echo "[calc] skipped"
          # Model > Calc > Graded calls: every 4th down 2022 on, graded by the browser engine (tools/calc_grade.mjs)
          node tools/calc_grade.mjs --site=site || echo "[grade] skipped"
      # League tab: kicker (and team-defense) projections, this week through 17 (reads the week pages above).
      - name: Kickers and defenses
        run: python tools/kdst_build.py --site=site
      # Hall of Fame list (Wikipedia; refreshes data/history/hof.csv for this build, the committed copy if it fails).
      # Read by the player logs (card badge) and the stats build (finder).
      - name: Hall of Fame
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/hof_build.py || true
      # Names for reserve-list stints the weekly reports never named (Wikipedia / ESPN news; data/history/ir_names.json
      # keeps the finished seasons, this run reads only new placements' news). Read by the player logs' injury history.
      - name: Injury names
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/injury_names_build.py || echo "[irnames] skipped"
      # Players > Moves: ESPN's transactions log, 2002 on (past seasons fetched once into the cache, this season daily).
      # Before the game logs, which mark mid-season trades / claims / signings from it.
      - name: Moves
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/transactions_build.py --site=site
      # Career game logs for the player card (one JSON per player; reads the week data files built above).
      - name: Player game logs
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/player_logs.py --site=site
      # Teams > Standings data (every season since 2002; ~10 s), rendered in the browser by assets/standings.js.
      - name: Standings
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/standings_build.py --site=site
      # Teams > Stats + Players > Stats data (1999 on). Finished seasons are aggregated once and kept in the cache;
      # the current season is redone when a game goes final.
      # League tab: Sleeper / ESPN / Yahoo player ids -> ours (+ names), for imported fantasy rosters.
      - name: Fantasy id map
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/fantasy_ids_build.py --site=site
      - name: Season stats
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/stats_build.py --site=site
      # Teams > Draft data (every pick since 1980 with career outcomes; ~2 s).
      - name: Draft
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/draft_build.py --site=site
      # Teams > Playoffs history (every postseason since 1920; 1933-98 from data/history/, seeds 1975-98 cached there).
      - name: Playoffs
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/playoffs_build.py --site=site
      # Teams > Playoffs odds: 10,000 simulated seasons as of the week the site shows (~1 min); track record from
      # data/history/playoff_odds_backtest.json.
      - name: Playoff odds
        run: python tools/playoff_odds.py --site=site
      # The odds-by-week chart needs each week's odds kept: commit only that file to the archive branch (the archive commit
      # above runs before the odds exist). Failures never fail the build.
      # Also what this build fed the model (data/live_inputs/, written by run.py: lines, wind, ECR scrape, projections),
      # so backtest accuracy can be checked against what the live site actually used.
      - name: Keep playoff odds and live input history
        working-directory: site
        run: |
          git add data/live_inputs/*.json || true
          git add data/playoffs/hist_*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Playoff odds and live inputs ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              git push origin HEAD:archive && break
              git pull --rebase -X theirs origin archive
            done
          fi
      # Team page > Depth: every team's latest depth chart (ESPN's, via nflverse; after Player game logs, which it links to).
      - name: Depth charts
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/depth_build.py --site=site
      # Plain-text pages for assistants and crawlers: players.md, players/<id>.md, teams/<TEAM>.md, injuries.md (after the
      # game logs, depth charts and injuries they read; tools/machine_pages.py).
      - name: Machine pages
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/machine_pages.py --site=site || echo "[machine] pages skipped"
      # Model > Reference: league-wide rates by down / distance, kicks, drives, leads (tools/reference_build.py; finished
      # seasons cached, the current one refetched).
      - name: Reference tables
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/reference_build.py --out site/data/reference.json || true
      # Players > Trends: compact play-by-play per season since 1999 (finished seasons cached), queried in the browser.
      - name: Trends
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: |
          python tools/trends_build.py --site=site
          # the query catalog for LLMs / scripts (measures, filters, breakdowns, charted seasons), from the page's engine
          node tools/trends_cli.mjs --schema --data=site > site/data/plays/schema.json || echo "[trends] schema skipped"
      # Player pages: NFL Edge grade (production percentile, 2018 on; tools/grade_build.py).
      - name: Edge grades
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/grade_build.py --site=site
      # Team / player pages and Teams > Stats: penalties per season since 1999 (tools/penalties_build.py).
      - name: Penalties
        if: needs.plan.outputs.complete == 'true' || steps.carry.outputs.carried != 'true'
        run: python tools/penalties_build.py --site=site
      # Team pages > Coaches: staffs (Wikipedia), records, unit ranks, tendencies, fourth downs (tools/coaches_build.py;
      # after Season stats and the Calculator, which it reads). Every full build: under a minute (coaches' pages cached in
      # the file for two weeks), and staff changes show the same day.
      - name: Coaches
        run: python tools/coaches_build.py --site=site || echo "[coaches] skipped"
      - name: Payroll  # the team card's Payroll tile (OverTheCap, once a day per team)
        run: python tools/payroll_build.py --site=site || echo "[payroll] skipped"
      - name: Honors  # the player card's Honors tile (finished seasons from data/history/honors.json; this one fetched)
        run: python tools/honors_build.py --site=site || echo "[honors] skipped"
      - name: Hall of Fame  # (DP) every drafted player's chance, the Honors sheet's (awards and rings from data/history)
        run: python tools/hof_eval.py --export=site || echo "[hof] skipped"
      - name: Stamp the deploy  # the plan reads both (lanes by what the live site was built from)
        run: |
          echo "{\"sha\":\"${{ github.sha }}\",\"lane\":\"full\"}" > site/data/deployed.json
          echo "{\"sha\":\"${{ github.sha }}\"}" > site/data/full_build.json
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 7   # the UI-only path builds on the last deployed site, so keep it past a skipped schedule
      - id: deployment
        uses: actions/deploy-pages@v4

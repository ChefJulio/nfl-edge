# nfl-edge model configuration. All knobs live here; code defaults mirror these values.

[data]
# Seasons of history loaded in addition to the current one. Meta-models (volume, efficiency,
# injury redistribution) are trained only on seasons strictly before the one being projected.
# 7 so the points formula can train on 6 prior seasons (each needs its prior season for features).
history_seasons = 7
# Learned components train on this many seasons immediately before the season being projected (or tested). Fixed
# rather than "everything loaded", so a long backtest (more history loaded) trains each season exactly the way
# the live site does, and training cost doesn't grow with the history window.
train_seasons = 2
cache_dir = "cache"
# Daily (Wed/Thu/Fri) practice participation from NFL.com's data API. Unofficial use of the public web client
# key (may break or conflict with NFL terms); past seasons are fetched once and cached. false = nflverse only.
nfl_api_practice = true
# First season of labelled practice history for the availability model (one-time fetch, then cached).
practice_history_start = 2018

[team_model]
# Prior-season plays enter the ridge fit with one flat weight: full (1.0) for week-1 projections, since they are
# all there is, then prior_weight x (decay - week) / (decay - 1) (about 0.26 at week 2) ...
prior_weight = 0.3
# ... reaching 0 at this target week.
prior_decay_week = 8
# Exponential recency weighting within the current season (weeks).
half_life_weeks = 3.0
# (No garbage-time filter: every play counts; removed 2026-10-15, better game predictions.)
# Ridge alpha grid searched with time-split CV (train weeks 1..N, predict N+1).
alpha_grid = [1, 3, 10, 30, 100, 300, 1000, 3000]
bootstrap_samples = 200
# Home edge: one league-wide term per unit, learned from recent seasons (so it tracks the decline from ~2.5 to
# ~1.75 pts). 20-season analysis (2005-25 results): team-specific home edges do not persist year to year
# (corr -0.02; Seattle +5.7 in 2005-12 vs -0.3 in 2019-25), travel distance / time zones show no effect, and
# shared-stadium games (LA, NY: 7 total) are too few to estimate. Division games show a ~0.8-pt smaller home edge
# (p=0.03), but adding that term worsened time-split CV on play EPA (4698 vs 4676), so it is off.
division_hfa = false
# Quarterback-aware pass offense: offense = team (line, receivers, scheme) + QB effect + an inexperienced-QB
# term (< qb_inexp_dropbacks career dropbacks). Team/QB ridge penalties tuned jointly by time-split CV.
qb_effects = true
qb_inexp_dropbacks = 150
qb_alpha_grid = [30, 100, 300, 1000, 1e9]
# Points formula (points = a + b x offensive EPA + c x special-teams EPA edge) trains on this many prior seasons;
# ratings and volume models keep the 2-season window. Game-level walk-forward 2021-25 (tools/game_eval.py): with
# 2 seasons the fitted special-teams weight drifted 0.9 -> 3.3; with 6 it settles near 2 (1.2, 1.9, 2.1, 2.1),
# margin MAE 10.71 -> 10.68 (CI -0.09 to +0.01), never worse in any season, winners 59.2% -> 61.4%.
# Fixed special-teams weights 0-2.5 were all within noise of the fit (points_st_weight = "fitted" kept).
points_seasons = 6
points_st_weight = "fitted"
# Ridge penalty on the inexperienced-QB indicator (one league-level effect, lightly penalized). Audit: 10 within
# noise; the 150-dropback cutoff vs 100 / 300 also within noise.
qb_inexp_alpha = 1.0
# Pass defense adjusted for starting cornerbacks likely out. Tested and rejected: counting only pre-game-knowable
# absences, no defensive (or O-line) personnel effect held up out of sample (details in personnel.py).
cb_adjust = false
# Plays-per-game model inputs: "base" (own pace, opponent plays allowed, Vegas total/spread). Tested and rejected
# (no out-of-sample gain in team play counts, 2025 and 2026): "pace" (+ neutral seconds per play) and "extended"
# (+ pace + expected EPA per play both ways, i.e. drive sustainability).
volume_features = "base"
seed = 7

[player_model]
# Recency half-life for usage shares (weeks). 5-season audit (2021-25): 3 beats 5 (-0.004 pts MAE, CI excludes 0;
# RB -0.012), 8 is worse (+0.004).
share_half_life_weeks = 3.0
# Expected-TD blend: weight on actual TDs = n / (n + td_blend_k), n = opportunities.
td_blend_k = 150
# Passing penalty above this wind speed (mph), per mph, capped. Grid-tuned walk-forward 2021-25 (thresholds 0-20,
# slopes 1-4%/mph, caps 25/40%): 10 mph is the sweet spot (slopes 2-4% all -0.010 to -0.012 MAE vs the old
# 15 / 2%, CI excludes 0); 0-5 mph thresholds unstable, steep + early is worse. Middle of the plateau adopted.
wind_threshold_mph = 10
wind_penalty_per_mph = 0.03
wind_penalty_cap = 0.25
# Role-change alert: snap-share jump (percentage points) vs prior 3-week average.
# Efficiency look-back: weight of this season, last season and two seasons back. Audit: flat and steep
# alternatives within noise (insensitive).
eff_season_weights = [1.0, 0.6, 0.3]
# Small-rate priors (scramble rate, fumbles per touch, aDOT, targets per route): "fixed" defaults or "fitted"
# (method of moments on the training seasons). Audit: fitted -0.001 (within noise) -> fitted, no hand-set values.
minor_priors = "fitted"
# Starting QB's minimum share of team dropbacks: "fixed" (starter_db_share) or "fitted" (measured: the top QB's
# share in each training team-game, injury exits included). Audit: measured (0.97) slightly worse (+0.001,
# CI excludes 0) -> 0.96 kept, now a tested value.
starter_share = "fixed"
starter_db_share = 0.96
role_change_snap_jump = 0.15
role_change_opp_jump = 0.08

[tiers]
# Rankings tier labels follow a standard league: tier N = positional ranks (N-1)*teams+1 .. N*teams, so with 10
# teams QB1 = QB 1-10, QB2 = 11-20, WR3 = 21-30. Pill color marks the roster slot the player fills: a starter
# (rank within teams x starters), the flex range (best remaining RB/WR/TE for teams x flex spots), or bench.
# Presentation only: not part of the model cache key or the MODEL.md fingerprint.
teams = 10
starters = { QB = 1, RB = 2, WR = 2, TE = 1 }
flex = 1
flex_positions = ["RB", "WR", "TE"]

[report]
output = "report/nfl_edge_week{week}.html"
# Playoff odds (tools/playoff_odds.py): each simulated season shifts every team's strength by N(0, drift x
# sqrt(share of season left)) log-odds. Pre-registered fit (2026-10-14): best make-playoffs Brier on 2021-23 of
# {0, .3, .6, .9, 1.2, 1.5} was 0.9; on held-out 2024-25 it scored 0.1273 vs 0.1344 with none, and fixed the
# overconfidence (teams given 85-95% made it 89% vs 76% without drift).
playoff_drift = 0.9
# Vegas win probability = 1 / (1 + exp(-k x spread)), k fit every run on past games' closing spreads. The tossup
# line comes from tools/win_prob.py: walk-forward on 2022-26, favorites the market gave under 59% won 54% +/- 6%
# (a coin flip explains it), while 3-point favorites won ~61%.
tossup_below = 0.59

[report.win_model]
# Our model's win chance = logistic(home x [not neutral] + rank_gap x (away power rank - home power rank)
#   + elo_per_100 x (home Elo - away Elo) / 100). Fit by tools/elo_eval.py: walk-forward Brier 0.2228 vs 0.2353 for
# the model margin alone and 0.2292 for rank gap + home (both CIs exclude 0); Vegas 0.2111. Elo settings (K, home
# field, offseason pull toward the mean, margin of victory) chosen by log loss, stable across test seasons.
elo_k = 20
elo_hfa = 25
elo_revert = 0.50
elo_margin = true
home = 0.1865
rank_gap = 0.0168
elo_per_100 = 0.4449

[experiments]
# Optional model inputs. Defaults reflect the walk-forward backtest (decided on 2025, confirmed on 2026):
# implied_total won clearly; air_yards and snap_input did not help consistently.
implied_total = true    # Vegas implied team total as an efficiency input
air_yards = false       # air-yards share (volume) + aDOT (receiving yards)
# Wind: "fixed" = the hand-set penalty in [player_model] (wind_threshold_mph etc.); "linear" / "quadratic" = wind
# (mph; domes 0) as a fitted input to every passing-efficiency regression. Audit: fixed beats both no-wind (TE
# +0.008, CI excludes 0) and fitted (TE +0.012: thin data learned a positive TE effect) -> fixed kept; its
# threshold / slope / cap now grid-tuned (see [player_model]).
wind_mode = "fixed"
snap_input = false      # snap share as a volume input (spec: flag only, so off unless you opt in)
# Goal-line role scaled by how often the team reaches the goal line (owner's idea, 2026-10-13): rush-TD rate gets
# gl_frac = team's expected inside-10 share of rushes (implied points + run offense) x the player's inside-10 share
# relative to his carry share. Walk-forward 2021-25, RB P(1+ rush TD) Brier -0.00021 [-0.00043, -0.000004],
# better in 4 of 5 seasons; RB points MAE not worse. A flat goal-line term (gl_share) and team committee tendency
# (rbbc) did not help and stay off.
gl_struct = true
# Opponent defense ratings in the efficiency regressions: "fitted" (old default), "drop", or "sign" (dropped when
# wrong-signed). With the Vegas implied total and schedule-adjusted player rates in, they fit ~0 and several came
# out wrong-signed. Walk-forward 2021-2026: drop = MAE -0.002 [-0.004, -0.000] (QB -0.008 [-0.016, -0.000], other
# positions no difference, better all 6 seasons), every P(1+ TD) Brier no difference; "sign" no difference. The
# opponent reaches projections through the Vegas total and team volume instead.
def_terms = "drop"
# Blend with FantasyPros expert consensus (free, scraped Fridays; only pre-kickoff ranks are used). Backtest:
# helps RB/WR (and TE in 2025); hurts QB, where the model alone beats the experts.
ecr_blend_positions = ["RB", "WR", "TE"]
# Usage-share normalization: shares are predicted player by player, so a team's projected carries / targets can
# add up to far more or less than a game holds (projected team target totals vary 1.5x as much as actual ones;
# players on over-subscribed teams came in over-projected). Each team's totals among players expected to play are
# pulled toward the measured typical total by this strength (0 off, 1 full). Walk-forward 2021-25: carries 0.7 +
# targets 0.3 = -0.017 MAE overall (CI excludes 0), RB -0.043 and RB rank correlation .507 -> .525; carries alone
# carry most of it (targets alone within noise); full strength over-corrects.
share_normalize_carries = 0.7
share_normalize_tgt = 0.3
# A RB / WR / TE in his first game for a team (no snap for it before) gets half his projected targets and carries; the
# rest goes to same-position teammates who play. Mid-season movers' first games came in at ~40% of projection.
# Walk-forward 2021-25 (pre-registered, owner 2026-10-15): newcomers + teammates MAE -0.009 [-0.011, -0.007],
# overall -0.002 [-0.004, 0.000], no position worse (WR -0.006).
newcomer_scale = 0.5
# Journeymen (team changes over the past 5 seasons + this one) come in under their projections: whole stat line x
# 0.94 / 0.91 / 0.89 for 1 / 2 / 3+ changes (data/history/journeyman.json). Fit 2021-23, tested 2024-25: MAE -0.108
# for those players, -0.039 overall, RB / WR / TE better, QB no difference (owner idea, pre-registered 2026-10-15).
journeyman = true
# Second opinion: final = (1 - w) ours + w Sleeper's projection (RotoWire's, free API; nfledge/sleeper.py), per
# position, week being played only. OFF: the pre-registered backtest passed (-0.020 [-0.039, -0.002]) but Sleeper's
# saved projections are edited after games (players hurt in-game zeroed), and the leak-free version failed
# (-0.011 [-0.029, +0.007]). Forward test from pre-kickoff snapshots (tools/sleeper_snapshot.py); INSIGHTS sec. 9.
# To test: { QB = 0.15, RB = 0.6, WR = 0.2, TE = 0.25 } (zero-skip weights fit 2021-26, leak-affected).
sleeper_blend = {}

[injuries]
# Fraction of the learned vacated-volume redistribution applied. Backtest: helps RB, slightly hurts WR;
# 0.5 keeps teammate projections near-unbiased in both 2025 and 2026.
redistribution_scale = 0.5
# Absences redistributed only for players at or above these projected shares. Audit: lower / higher within noise.
redistribute_min_share = { tgt_share = 0.08, carry_share = 0.15 }
# Gradient-boosting settings for the practice-availability and healthy-scratch models. Audit: smaller / larger
# models within noise on points and availability Brier (0.0998-0.1006 vs 0.1003).
gb_iterations = 200
gb_learning_rate = 0.05
gb_max_depth = 3

[uncertainty]
# Range widening relative to an established player: few games played (factor), low-data flag, and roles boosted
# by a teammate's absence. Audit: the multipliers made calibration WORSE (78.3% / 49.5% inside 10-90 / 25-75 vs
# 80.0% / 50.2% without; targets 80 / 50) -> off. The empirical ranges already reflect outcome spread.
games_factor = 0.0
low_sample_widen = 1.0
injury_boost_widen = 1.0
